<script>
(function(){
var LS='carteira-b3-v1';
var CLS=['Ações','FIIs','ETFs','Renda fixa','Exterior','Cripto','Fundos','Outros'];
var SRCS=['B3','Nubank','Nomad','Outra'];
var uid=function(){return Math.random().toString(36).slice(2,9)};
var today=function(){return new Date().toISOString().slice(0,10)};
var S=load(); var tab=(location.hash||'#resumo').slice(1); var ui={q:'',cls:'Todas',mf:'Todos',edit:null};
if(['resumo','carteira','proventos','importar'].indexOf(tab)<0)tab='resumo';
function demoData(){
var d=new Date(),ym=function(back,day){var x=new Date(d.getFullYear(),d.getMonth()-back,day);return x.toISOString().slice(0,10)};
var P=function(src,inst,tk,name,cls,qty,price,cost,cur){return{id:uid(),src:src,inst:inst,tk:tk,name:name,cls:cls,qty:qty,price:price,value:qty*price,cost:cost==null?null:qty*cost,cur:cur||'BRL'}};
var pos=[
P('B3','XP Investimentos','PETR4','Petrobras PN','Ações',200,38.2,31.4),
P('B3','XP Investimentos','VALE3','Vale ON','Ações',120,62.1,68.9),
P('B3','XP Investimentos','ITUB4','Itaú Unibanco PN','Ações',300,33.5,27.2),
P('B3','XP Investimentos','HGLG11','CSHG Logística FII','FIIs',40,158,162.5),
P('B3','XP Investimentos','MXRF11','Maxi Renda FII','FIIs',500,9.6,9.9),
P('B3','XP Investimentos','BOVA11','iShares Ibovespa','ETFs',30,128,115),
P('B3','Tesouro Direto','Tesouro Selic 2029','Tesouro Selic 2029','Renda fixa',1,12400,null),
P('Nubank','Nubank','Caixinha RDB','Caixinha Nubank (RDB)','Renda fixa',1,8500,null),
P('Nubank','Nubank','BTC','Bitcoin','Cripto',0.01,600000,null),
P('Nomad','Nomad','AAPL','Apple','Exterior',6,230,185,'USD'),
P('Nomad','Nomad','VOO','Vanguard S&P 500 ETF','Exterior',4,540,470,'USD')
];
var M=function(date,kind,tk,inst,value){return{id:uid(),date:date,type:'provento',kind:kind,tk:tk,inst:inst,qty:0,price:0,value:value,src:'B3'}};
var moves=[];
for(var i=0;i<9;i++){
moves.push(M(ym(i,15),'Rendimento','MXRF11','XP Investimentos',+(500*0.09).toFixed(2)));
moves.push(M(ym(i,14),'Rendimento','HGLG11','XP Investimentos',+(40*1.1).toFixed(2)));
if(i%3==0){moves.push(M(ym(i,20),'JCP','ITUB4','XP Investimentos',+(300*0.26).toFixed(2)));moves.push(M(ym(i,25),'Dividendo','PETR4','XP Investimentos',+(200*1.4).toFixed(2)))}
}
moves.push({id:uid(),date:ym(1,8),type:'compra',kind:'',tk:'ITUB4',inst:'XP Investimentos',qty:50,price:32.8,value:1640,src:'B3'});
moves.push({id:uid(),date:ym(2,3),type:'venda',kind:'',tk:'VALE3',inst:'XP Investimentos',qty:30,price:64,value:1920,src:'B3'});
var st={demo:true,usd:5.5,hide:false,positions:pos,moves:moves,snaps:[]};
var tot=total(st),k=[.78,.8,.83,.82,.87,.9,.93,.96,1];
for(var j=0;j<k.length;j++)st.snaps.push({d:ym(k.length-1-j,28),v:Math.round(tot*k[j])});
st.snaps[st.snaps.length-1]={d:today(),v:Math.round(tot)};
return st;
}
function load(){try{var r=localStorage.getItem(LS);if(r){var o=JSON.parse(r);if(o&&o.positions)return o}}catch(e){}return demoData()}
function save(){try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}}
function brl(p,st){st=st||S;return p.value*(p.cur==='USD'?st.usd:1)}
function costBrl(p){return p.cost==null?null:p.cost*(p.cur==='USD'?S.usd:1)}
function total(st){return (st||S).positions.reduce(function(a,p){return a+brl(p,st)},0)}
function snapshot(){var t=Math.round(total()),d=today();S.snaps=S.snaps.filter(function(x){return x.d!==d});S.snaps.push({d:d,v:t});S.snaps.sort(function(a,b){return a.d<b.d?-1:1});if(S.snaps.length>400)S.snaps=S.snaps.slice(-400)}
function clearDemo(){if(S.demo){S={demo:false,usd:S.usd,hide:S.hide,positions:[],moves:[],snaps:[]}}}
var fBRL=new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'});
var fNum=new Intl.NumberFormat('pt-BR',{maximumFractionDigits:6});
function money(n){return S.hide?'R$ ••••':fBRL.format(n)}
function pct(n){return (n>=0?'+':'')+n.toFixed(1).replace('.',',')+'%'}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function monthName(k){var m=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];return m[+k.slice(5,7)-1]+'/'+k.slice(2,4)}
function dmy(iso){return iso.slice(8,10)+'/'+iso.slice(5,7)+'/'+iso.slice(0,4)}
function clsColor(c){var i=CLS.indexOf(c);return 'var(--c'+((i<0?7:i)+1)+')'}
function norm(s){return String(s==null?'':s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim()}
function num(v){
if(typeof v==='number')return v;
var s=String(v==null?'':v).replace(/R\$|US\$|\$|\s/g,'');
if(!s||s==='-')return NaN;
if(s.indexOf(',')>=0&&s.indexOf('.')>=0)s=s.replace(/\./g,'').replace(',','.');
else if(s.indexOf(',')>=0)s=s.replace(',','.');
else if(/^-?\d{1,3}(\.\d{3})+$/.test(s))s=s.replace(/\./g,'');
var n=parseFloat(s);return isNaN(n)?NaN:n;
}
function pdate(v){
if(v instanceof Date)return new Date(v.getTime()+12*3600e3).toISOString().slice(0,10);
if(typeof v==='number'&&v>20000)return new Date(Math.round((v-25569)*864e5)).toISOString().slice(0,10);
var s=String(v||'').trim(),m;
if((m=s.match(/^(\d{2})\/(\d{2})\/(\d{4})/)))return m[3]+'-'+m[2]+'-'+m[1];
if((m=s.match(/^(\d{4})-(\d{2})-(\d{2})/)))return m[0];
return '';
}
function parseCSV(text){
text=text.replace(/^\uFEFF/,'');var first=text.split(/\r?\n/,1)[0];
var d=first.split(';').length>first.split(',').length?';':(first.split('\t').length>first.split(',').length?'\t':',');
var rows=[],row=[],cur='',q=false;
for(var i=0;i<text.length;i++){var c=text[i];
if(q){if(c==='"'){if(text[i+1]==='"'){cur+='"';i++}else q=false}else cur+=c}
else if(c==='"')q=true;
else if(c===d){row.push(cur);cur=''}
else if(c==='\n'||c==='\r'){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cur);cur='';rows.push(row);row=[]}
else cur+=c}
if(cur!==''||row.length){row.push(cur);rows.push(row)}
return rows;
}
function toObjs(rows){
var h=-1;for(var i=0;i<Math.min(rows.length,15);i++){var n=rows[i].filter(function(c){return String(c).trim()!==''}).length;if(n>=3){h=i;break}}
if(h<0)return{keys:[],objs:[]};
var keys=rows[h].map(norm),objs=[];
for(var r=h+1;r<rows.length;r++){var o={},any=false;
keys.forEach(function(k,j){if(k){o[k]=rows[r][j];if(String(rows[r][j]==null?'':rows[r][j]).trim()!=='')any=true}});
if(any)objs.push(o)}
return{keys:keys,objs:objs};
}
function pick(o,cands,exact){
var ks=Object.keys(o);
for(var i=0;i<cands.length;i++){
var k=ks.filter(function(x){return exact?x===cands[i]:x.indexOf(cands[i])>=0&&x.indexOf('dispon')<0})[0];
if(k!==undefined&&String(o[k]).trim()!==''&&String(o[k]).trim()!=='-')return o[k];
}
return '';
}
function codeOf(prod){
var t=String(prod||'').split(' - ')[0].trim().toUpperCase();
if(/^[A-Z]{4}\d{1,2}F$/.test(t))t=t.slice(0,-1);
return t;
}
function classify(tk,name,hint,cur){
var n=norm(name+' '+tk),t=String(tk).toUpperCase(),h=norm(hint||'');
if(/tesouro/.test(n))return 'Renda fixa';
if(/\b(cdb|lci|lca|cri|cra|debenture|rdb|lc|lft|ntn)\b/.test(n))return 'Renda fixa';
if(/cripto|bitcoin|ethereum/.test(n)||/^(BTC|ETH|SOL|USDT|ADA|XRP)$/.test(t))return 'Cripto';
if(/^[A-Z]{4}(34|35|39)$/.test(t))return 'Exterior';
if(/^[A-Z]{4}11$/.test(t))return /etf|ishares|index|ibov|s&p|nasdaq/.test(n)&&!/fii|imobili/.test(n)?'ETFs':'FIIs';
if(/^[A-Z]{4}\d{1,2}$/.test(t))return 'Ações';
if(cur==='USD')return 'Exterior';
if(/fundo/.test(h))return 'Fundos';
if(/acoes/.test(h))return 'Ações';
return 'Outros';
}
function autoSrc(name,keys){var n=norm(name);if(/nubank|nuinvest|nu invest/.test(n))return 'Nubank';if(/nomad/.test(n))return 'Nomad';if(keys.indexOf('codigo de negociacao')>=0||keys.some(function(k){return k.indexOf('entrada')===0})||keys.indexOf('escriturador')>=0)return 'B3';return 'Outra'}
function parseSheet(rows,sheetName,src,cur,fname){
var res={pos:[],moves:[]},t=toObjs(rows),keys=t.keys;if(!keys.length)return res;
if(src==='auto')src=autoSrc(fname||'',keys);
var has=function(f){return keys.some(f)};
var isMove=has(function(k){return k==="data"})&&has(function(k){return k==='movimentacao'||k==='tipo'||k.indexOf('entrada')===0||k==='tipo de movimentacao'});
var isPos=!isMove&&has(function(k){return k.indexOf('quantidade')>=0})&&has(function(k){return k.indexOf('valor')>=0||k.indexOf('preco')>=0||k.indexOf('cotacao')>=0||k==='saldo'});
t.objs.forEach(function(o){
var prod=pick(o,['produto','nome','descricao','ativo'])||'';
var tk=pick(o,['codigo de negociacao','ticker','simbolo','codigo','ativo'])||codeOf(prod);
tk=String(tk).trim().toUpperCase()===String(tk).trim()&&/^[A-Za-z0-9.]{2,12}$/.test(String(tk).trim())?codeOf(tk):(codeOf(prod)||String(prod).trim());
if(!tk)return;
var name=String(prod||tk).split(' - ').slice(1).join(' - ')||String(prod||tk);
var inst=String(pick(o,['instituicao','corretora','banco'])||(src==='B3'?'B3':src)).trim();
if(isPos){
var qty=num(pick(o,['quantidade'],true));if(isNaN(qty))qty=num(pick(o,['quantidade']));
var price=num(pick(o,['preco de fechamento','preco atual','cotacao','preco']));
var val=num(pick(o,['valor atualizado','valor liquido','valor bruto','valor total','saldo','valor']));
if(isNaN(val)&&!isNaN(qty)&&!isNaN(price))val=qty*price;
if(isNaN(val)||val===0)return;
if(isNaN(qty)||qty===0)qty=1;
if(isNaN(price))price=val/qty;
var mo=norm(pick(o,['moeda']));var c=mo.indexOf('usd')>=0||mo.indexOf('dolar')>=0||mo==='us$'?'USD':(mo?'BRL':cur);
var cu=num(pick(o,['preco medio','custo medio'])),ct=num(pick(o,['valor aplicado','custo total']));
var cost=!isNaN(ct)?ct:(!isNaN(cu)?cu*qty:null);
var cl=String(pick(o,['classe','categoria'])||'').trim();
res.pos.push({id:uid(),src:src,inst:inst,tk:tk,name:name,cls:CLS.indexOf(cl)>=0?cl:classify(tk,name,sheetName,c),qty:qty,price:price,value:val,cost:cost,cur:c});
}else if(isMove){
var date=pdate(pick(o,['data']));if(!date)return;
var tx=norm(pick(o,['movimentacao','tipo de movimentacao','tipo'],false)),flow=norm(pick(o,['entrada/saida']));
var q2=num(pick(o,['quantidade'])),pu=num(pick(o,['preco unitario','preco'])),vo=num(pick(o,['valor da operacao','valor']));
if(isNaN(vo)&&!isNaN(q2)&&!isNaN(pu))vo=q2*pu;
var type='',kind='';
if(/dividend|juros sobre capital|jcp|rendimento|provento/.test(tx)&&!/taxa|imposto|\bir\b/.test(tx)){type='provento';kind=/juros sobre capital|jcp/.test(tx)?'JCP':/rendimento/.test(tx)?'Rendimento':'Dividendo'}
else if(/compra/.test(tx))type='compra';
else if(/venda/.test(tx))type='venda';
else if(/liquidacao/.test(tx))type=flow.indexOf('cred')===0?'compra':(flow.indexOf('deb')===0?'venda':'');
if(!type||isNaN(vo))return;
res.moves.push({id:uid(),date:date,type:type,kind:kind,tk:tk,inst:inst,qty:isNaN(q2)?0:q2,price:isNaN(pu)?0:pu,value:Math.abs(vo),src:src});
}
});
return res;
}
function readFile(file){
return new Promise(function(ok,fail){
var fr=new FileReader(),isCsv=/\.(csv|txt)$/i.test(file.name);
fr.onerror=function(){fail(new Error('Não consegui ler '+file.name))};
fr.onload=function(){
try{
if(isCsv)return ok([{name:'csv',rows:parseCSV(String(fr.result))}]);
if(!window.XLSX)throw new Error('Leitor de Excel não carregou. Use CSV.');
var wb=XLSX.read(fr.result,{type:'array',cellDates:true});
ok(wb.SheetNames.map(function(n){return{name:n,rows:XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:true,defval:''})}}));
}catch(e){fail(e)}
};
if(isCsv)fr.readAsText(file,'utf-8');else fr.readAsArrayBuffer(file);
});
}
function recalcCosts(src){
S.positions.forEach(function(p){
if(p.src!==src||p.cost!=null)return;
var ms=S.moves.filter(function(m){return m.src===src&&m.tk===p.tk&&(m.type==='compra'||m.type==='venda')}).sort(function(a,b){return a.date<b.date?-1:1});
if(!ms.length)return;
var q=0,c=0;
ms.forEach(function(m){if(m.type==='compra'){q+=m.qty;c+=m.value}else if(q>0){var f=Math.min(1,m.qty/q);c-=c*f;q-=m.qty}});
if(q>0&&Math.abs(q-p.qty)<=Math.max(.5,.01*p.qty)){p.cost=c;p.costAuto=true}
});
}
async function importFiles(files,src,cur){

var sheets=await readFile(files[i]);
sheets.forEach(function(s){bag.push(parseSheet(s.rows,s.name,src,cur,files[i].name))});
}
var pos=[],moves=[],srcs={};
bag.forEach(function(r){pos=pos.concat(r.pos);moves=moves.concat(r.moves);r.pos.concat(r.moves).forEach(function(x){srcs[x.src]=1})});
if(!pos.length&&!moves.length)throw new Error('Não encontrei posições nem movimentações. Confira as colunas do modelo abaixo.');
clearDemo();
var np=0,nm=0;
Object.keys(srcs).forEach(function(sc){var ps=pos.filter(function(p){return p.src===sc});if(ps.length){S.positions=S.positions.filter(function(p){return p.src!==sc}).concat(ps);np+=ps.length}});
if(moves.length){
var key=function(m){return [m.date,m.type,m.tk,m.inst,m.qty,m.value].join('|')},have={};
S.moves.forEach(function(m){have[key(m)]=1});
moves.forEach(function(m){if(!have[key(m)]){have[key(m)]=1;S.moves.push(m);nm++}});
}
Object.keys(srcs).forEach(recalcCosts);snapshot();save();
return Object.keys(srcs).join(' + ')+': '+np+' posições, '+nm+' movimentações novas';
}

'<circle cx="'+X(pts.length-1).toFixed(1)+'" cy="'+Y(last.v).toFixed(1)+'" r="4" fill="var(--accent)"/>'+

'<div class="field"><label for="cur">Moeda dos valores</label><select id="cur"><option value="BRL">Reais (R$)</option><option value="USD">Dólar (US$)</option></select></div></div>'+
'<p class="note">Ao importar posições de uma origem, a posição anterior dessa origem é substituída. Movimentações repetidas são ignoradas.</p></div>'+
'<div class="panel"><h2>Cotações ao vivo</h2>'+
'<p class="note">Ações, FIIs, ETFs e BDRs vêm da brapi, cripto da CoinGecko e o dólar da AwesomeAPI. O app atualiza ao abrir e a cada 15 minutos durante o pregão. O plano gratuito da brapi tem atraso de cerca de 30 minutos e 15 mil consultas por mês.</p>'+
'<div class="field"><label for="tok">Token da brapi (grátis)</label><input type="text" id="tok" placeholder="Cole o token aqui" value="'+esc(Q.token||'')+'" autocomplete="off"></div>'+
'<p class="note">Sem token, só PETR4, VALE3, ITUB4 e MGLU3 atualizam. <a href="https://brapi.dev/dashboard" target="_blank" rel="noopener">Criar token grátis</a>. O token fica só neste aparelho. Consultas neste mês: '+(Q.count||0)+'.</p>'+
'<div class="field"><label for="usd">Dólar (R$ por US$)</label><input type="number" id="usd" step="0.01" value="'+S.usd+'"></div>'+
'<button class="btn ghost" data-a="refresh" style="width:100%">Atualizar cotações agora</button></div>'+
'<div class="panel"><h2>Como pegar os arquivos</h2>'+
'<p class="note"><b>B3:</b> entre no <a href="https://www.investidor.b3.com.br/" target="_blank" rel="noopener">Canal do Investidor</a>, abra Extratos e baixe <b>Posição</b> e <b>Movimentação</b> em Excel. O app lê todas as abas (ações, fundos, renda fixa, Tesouro).</p>'+
'<p class="note"><b>Nubank e Nomad:</b> o que passa por corretora aparece na B3. Para o resto (Caixinhas, cripto, dólar na Nomad), use Adicionar rápido ou um CSV no modelo abaixo.</p>'+
'<div class="label" style="margin-top:12px">Modelo de posições</div><pre id="t1">'+esc(TPL_POS)+'</pre><button class="btn ghost" data-a="copy" data-v="1">Copiar modelo</button>'+
'<div class="label" style="margin-top:14px">Modelo de movimentações</div><pre id="t2">'+esc(TPL_MOV)+'</pre><button class="btn ghost" data-a="copy" data-v="2">Copiar modelo</button></div>'+
'<div class="panel"><h2>Seus dados</h2><p class="note">Tudo fica salvo só neste navegador, neste aparelho. Só os códigos dos ativos (e o token) saem para consultar cotações.</p><div class="acts"><button class="btn" data-a="dlbackup">Baixar backup</button><button class="btn ghost" data-a="dlcsv">Baixar carteira (CSV)</button><button class="btn ghost" data-a="backup">Copiar backup</button><button class="btn ghost" data-a="restore">Restaurar backup</button><button class="btn danger" data-a="wipe">Apagar tudo</button></div></div>';
}
function sheetEdit(){
var id=ui.edit;if(!id)return '';
var isNew=id==='new',p=isNew?{id:uid(),src:'Outra',inst:'',tk:'',name:'',cls:'Ações',qty:1,price:0,value:0,cost:null,cur:'BRL'}:S.positions.filter(function(x){return x.id===id})[0];
if(!p)return '';
var avg=p.cost!=null&&p.qty?p.cost/p.qty:'';
return '<div class="sheet-bg" data-a="close"><div class="sheet" role="dialog" aria-label="Editar ativo"><h2>'+(isNew?'Novo ativo':esc(p.tk))+'</h2>'+
(isNew?'<div class="two"><div class="field"><label for="e-tk">Ativo</label><input type="text" id="e-tk"></div><div class="field"><label for="e-inst">Instituição</label><input type="text" id="e-inst" placeholder="Nubank, Nomad..."></div></div><div class="field"><label for="e-cls">Classe</label><select id="e-cls">'+CLS.map(function(c){return '<option>'+c+'</option>'}).join('')+'</select></div>':'<p class="note">'+esc(p.name)+' · '+esc(p.inst)+'</p>')+
'<div class="two"><div class="field"><label for="e-qty">Quantidade</label><input type="number" id="e-qty" step="any" value="'+p.qty+'"></div><div class="field"><label for="e-price">Preço atual ('+(p.cur==='USD'?'US$':'R$')+')</label><input type="number" id="e-price" step="any" value="'+(+p.price.toFixed(4))+'"></div></div>'+
'<div class="two"><div class="field"><label for="e-avg">Preço médio</label><input type="number" id="e-avg" step="any" value="'+(avg===''?'':+avg.toFixed(4))+'"></div><div class="field"><label for="e-cur">Moeda</label><select id="e-cur"><option value="BRL"'+(p.cur==='BRL'?' selected':'')+'>R$</option><option value="USD"'+(p.cur==='USD'?' selected':'')+'>US$</option></select></div></div>'+
'<div class="acts"><button class="btn" data-a="saveedit">Salvar</button>'+(isNew?'':'<button class="btn danger" data-a="del">Excluir</button>')+'<button class="btn ghost" data-a="close">Cancelar</button></div></div></div>';
}
function render(){
var h='<header class="top"><h1>Minha Carteira</h1><button class="iconbtn" data-a="hide" aria-label="Ocultar valores" aria-pressed="'+S.hide+'">'+(S.hide?'Mostrar':'Ocultar')+'</button></header>';
h+='<div class="qline"><span id="qs">'+(S.demo?'Dados de exemplo':qLine())+'</span><button class="iconbtn" data-a="refresh">Atualizar</button></div>';
if(S.demo)h+='<div class="banner"><span>Dados de exemplo. Importe seus arquivos para ver a sua carteira.</span><button data-a="go" data-v="importar">Importar</button></div>';
h+=tab==='resumo'?vResumo():tab==='carteira'?vCarteira():tab==='proventos'?vProventos():vImportar();
document.getElementById('app').innerHTML=h;
document.getElementById('overlay').innerHTML=sheetEdit();
var ic={resumo:'<path d="M12 3v9h9A9 9 0 1 1 12 3z"/><path d="M15 3.5A9 9 0 0 1 20.5 9H15z"/>',carteira:'<path d="M4 6h16M4 12h16M4 18h10"/>',proventos:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',importar:'<path d="M12 16V4m0 0L7 9m5-5 5 5M4 20h16"/>'};
var nm={resumo:'Resumo',carteira:'Carteira',proventos:'Proventos',importar:'Importar'};
document.getElementById('tabs').innerHTML=Object.keys(nm).map(function(k){return '<button data-a="go" data-v="'+k+'"'+(tab===k?' aria-current="page"':'')+'><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">'+ic[k]+'</svg>'+nm[k]+'</button>'}).join('');
}
function toast(msg){var t=document.getElementById('toast');t.textContent=msg;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(function(){t.hidden=true},4200)}
function go(t){tab=t;try{history.replaceState(null,'','#'+t)}catch(e){location.hash=t}render();window.scrollTo(0,0)}
document.addEventListener('click',function(e){
var el=e.target.closest('[data-a]');if(!el)return;
var a=el.dataset.a,v=el.dataset.v;
if(a==='go')go(v);
else if(a==='hide'){S.hide=!S.hide;save();render()}
else if(a==='refresh'){refreshQuotes(true)}
else if(a==='quick'){Q.inst=document.getElementById('qinst').value.trim();qsave();quickAdd()}
else if(a==='cls'){ui.cls=v;render()}
else if(a==='mf'){ui.mf=v;render()}
else if(a==='edit'){ui.edit=el.dataset.id;render()}
else if(a==='new'){ui.edit='new';render()}
else if(a==='close'){if(e.target===el||el.tagName==='BUTTON'){ui.edit=null;render()}}
else if(a==='del'){S.positions=S.positions.filter(function(p){return p.id!==ui.edit});snapshot();save();ui.edit=null;render()}
else if(a==='saveedit'){
var g=function(i){return document.getElementById(i)},isNew=ui.edit==='new',p;
if(isNew){var tk=g('e-tk').value.trim();if(!tk){toast('Informe o nome do ativo.');return}clearDemo();p={id:uid(),src:'Outra',inst:g('e-inst').value.trim()||'Outra',tk:tk.toUpperCase(),name:tk,cls:g('e-cls').value,cost:null};S.positions.push(p)}
else p=S.positions.filter(function(x){return x.id===ui.edit})[0];
p.qty=parseFloat(g('e-qty').value)||0;p.price=parseFloat(g('e-price').value)||0;p.cur=g('e-cur').value;p.value=p.qty*p.price;
var av=parseFloat(g('e-avg').value);p.cost=isNaN(av)?null:av*p.qty;p.costAuto=false;
snapshot();save();ui.edit=null;render();toast('Ativo salvo.');
}
else if(a==='copy'){
var txt=v==='1'?TPL_POS:TPL_MOV;
var fb=function(){var r=document.createRange();r.selectNodeContents(document.getElementById('t'+v));var s=getSelection();s.removeAllRanges();s.addRange(r);toast('Modelo selecionado. Copie manualmente.')};
try{navigator.clipboard.writeText(txt).then(function(){toast('Modelo copiado.')},fb)}catch(x){fb()}
}
else if(a==='backup'){
var js=JSON.stringify(S);
var fb2=function(){showText(js)};
try{navigator.clipboard.writeText(js).then(function(){toast('Backup copiado. Cole em um lugar seguro.')},fb2)}catch(x){fb2()}
}
else if(a==='dlbackup'){saveFile('carteira-backup-'+today()+'.json',JSON.stringify(S))}
else if(a==='dlcsv'){
var L=['ativo;instituicao;classe;quantidade;preco;moeda;preco_medio'];
var c2=function(n){return String(n).replace('.',',')};
S.positions.forEach(function(p){L.push([p.tk,p.inst,p.cls,c2(p.qty),c2(+p.price.toFixed(4)),p.cur,p.cost==null?'':c2(+(p.cost/p.qty).toFixed(4))].join(';'))});
saveFile('carteira-'+today()+'.csv','\uFEFF'+L.join('\n'));
}
else if(a==='restore'){showText('',true)}
else if(a==='dorestore'){
try{var o=JSON.parse(document.getElementById('bk').value);if(!o||!o.positions)throw 0;S=o;save();ui.edit=null;document.getElementById('overlay').innerHTML='';render();toast('Backup restaurado.')}catch(x){toast('Backup inválido.')}
}
else if(a==='wipe'){
if(el.dataset.v==='sure'){S={demo:false,usd:S.usd,hide:S.hide,positions:[],moves:[],snaps:[]};save();render();toast('Dados apagados.')}
else{el.textContent='Toque de novo para confirmar';el.dataset.v='sure'}
}
});
var DL=null;try{if(window.claude&&claude.use)claude.use('downloads').then(function(d){DL=d}).catch(function(){})}catch(e){}
function saveFile(name,data){
if(!DL){try{var b=new Blob([data],{type:'text/plain'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(u)},4000);toast('Arquivo baixado.')}catch(e){showText(typeof data==='string'?data:'')}return}
DL.save({filename:name,data:data}).then(function(){toast('Arquivo salvo.')}).catch(function(err){if(!err||err.code!=='declined')toast('Não foi possível baixar.')});
}
function showText(txt,editable){
document.getElementById('overlay').innerHTML='<div class="sheet-bg" data-a="closetext"><div class="sheet"><h2>'+(editable?'Restaurar backup':'Backup')+'</h2><div class="field"><textarea id="bk" rows="8" style="width:100%;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:10px;font-size:12px">'+esc(txt)+'</textarea></div><div class="acts">'+(editable?'<button class="btn" data-a="dorestore">Restaurar</button>':'')+'<button class="btn ghost" data-a="closetext">Fechar</button></div></div></div>';
var t=document.getElementById('bk');if(t&&!editable){t.focus();t.select()}
}
document.addEventListener('click',function(e){var el=e.target.closest('[data-a="closetext"]');if(el&&(e.target===el||el.tagName==='BUTTON'))document.getElementById('overlay').innerHTML=''});
document.addEventListener('input',function(e){
if(e.target.id==='q'){ui.q=e.target.value;document.getElementById('plist').innerHTML=listPos()}
});
document.addEventListener('change',function(e){
if(e.target.id==='tok'){Q.token=e.target.value.trim();Q.lastB3=0;qsave();toast(Q.token?'Token salvo.':'Token removido.')}
if(e.target.id==='usd'){var n=parseFloat(e.target.value);if(n>0){S.usd=n;snapshot();save();toast('Câmbio atualizado.')}}
if(e.target.id==='file'){doImport(e.target.files);e.target.value=''}
});
function doImport(files){
if(!files||!files.length)return;
var src=document.getElementById('src').value,cur=document.getElementById('cur').value;
if(/\.json$/i.test(files[0].name)){files[0].text().then(function(t){try{var o=JSON.parse(t);if(!o||!o.positions)throw 0;S=o;save();render();toast('Backup restaurado.')}catch(x){toast('Backup inválido.')}});return}
toast('Lendo arquivo...');
importFiles(Array.prototype.slice.call(files),src,cur).then(function(msg){render();toast(msg);refreshQuotes(true)}).catch(function(err){toast(err.message||'Erro ao importar.')});
}
document.addEventListener('dragover',function(e){var d=document.getElementById('drop');if(d){e.preventDefault();d.classList.add('on')}});
document.addEventListener('dragleave',function(){var d=document.getElementById('drop');if(d)d.classList.remove('on')});
document.addEventListener('drop',function(e){var d=document.getElementById('drop');if(d){e.preventDefault();d.classList.remove('on');doImport(e.dataTransfer.files)}});
window.addEventListener('hashchange',function(){var t=location.hash.slice(1);if(['resumo','carteira','proventos','importar'].indexOf(t)>=0&&t!==tab){tab=t;render()}});
render();
setTimeout(function(){refreshQuotes(false)},800);
document.addEventListener('visibilitychange',function(){if(!document.hidden)refreshQuotes(false)});
setInterval(function(){if(!document.hidden)refreshQuotes(false)},15*60*1000);
})();
</script>
<script>if("serviceWorker" in navigator)window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})});</script>
